name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check whalesignal tests scripts

      - name: Byte-compile all modules
        run: python -m compileall -q whalesignal

      - name: Run test suite (20 tests)
        run: pytest -q

      - name: Standalone test scripts (no pytest, no key, no network)
        run: |
          python tests/test_signals.py
          python tests/test_demo_pipeline.py
          python tests/test_briefing.py
          python tests/test_web.py
          python tests/test_fixtures.py
