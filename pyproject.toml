[project]
name = "whalesignal-mcp"
version = "0.1.0"
description = "Composite market-intelligence MCP server built on the Unusual Whales API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
whalesignal = "whalesignal.cli:main"
whalesignal-mcp = "whalesignal.server:main"
whalesignal-web = "whalesignal.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally mutate sys.path / env before importing the package.
"tests/*" = ["E402"]

[tool.setuptools]
packages = ["whalesignal"]

[tool.setuptools.package-data]
whalesignal = ["dashboard.html"]
