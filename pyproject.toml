[project]
name = "whalesignal-mcp"
version = "0.1.0"
description = "Composite market-intelligence MCP server built on the Unusual Whales API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
whalesignal = "whalesignal.cli:main"
whalesignal-mcp = "whalesignal.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["whalesignal"]
